<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5efdf">
  <title>攻撃の動き — 灯りの迷宮</title>
  <link rel="stylesheet" href="combat-preview.css">
  <script defer src="data.js"></script>
  <script defer src="world.js"></script>
  <script defer src="enemies.js"></script>
  <script defer src="save.js"></script>
  <script defer src="engine.js"></script>
  <script defer src="renderer.js"></script>
  <script defer src="combat-preview.js"></script>
</head>
<body>
  <main>
    <header><span>灯りの迷宮 · 動きの確認</span><a href="./">冒険で試す ↗</a></header>
    <h1>剣を振る、魔物が返す。</h1>
    <p class="intro">実ゲームと同じ攻撃処理・描画。冒険のセーブには影響しません。</p>
    <div class="scenarios" role="group" aria-label="確認する場面">
      <button data-scene="duel" aria-pressed="true">一対一</button>
      <button data-scene="surrounded" aria-pressed="false">囲まれる</button>
      <button data-scene="miss" aria-pressed="false">空振り</button>
      <button data-scene="kill" aria-pressed="false">撃破</button>
      <button data-scene="ranged" aria-pressed="false">敵の射撃</button>
    </div>
    <section class="stage" aria-label="攻撃アニメーションの確認">
      <div id="viewport"><canvas id="scene" width="880" height="900" role="img" aria-label="リネと魔物の攻撃アニメーション"></canvas></div>
      <canvas id="minimap" width="144" height="96" aria-label="確認用のマップ"></canvas>
      <span class="stage-label" id="scene-label">一対一 · 攻撃 → 反撃</span>
    </section>
    <p class="notice" id="motion-notice" hidden>端末の「動きを減らす」設定に合わせ、移動・斬撃・揺れを省略しています。</p>
    <div class="controls">
      <button id="attack">攻撃する</button>
      <button id="wait">足踏み</button>
      <button id="auto" aria-pressed="false">自動再生</button>
    </div>
    <p id="feedback" role="status" aria-live="polite">「攻撃する」で動きを確認できます。</p>
    <p class="detail">踏み込み → 命中 → 反撃。複数の敵は短い間隔で動きます。</p>
  </main>
</body>
</html>
